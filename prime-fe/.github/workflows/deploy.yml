name: FE Build & Push

on:
  push:
    branches:
      - master
      - develop

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            --build-arg REACT_APP_BACKEND_URL=${{ github.ref == 'refs/heads/master' && secrets.REACT_APP_BACKEND_URL || secrets.REACT_APP_DEV_BACKEND_URL }} \
            --build-arg REACT_APP_NAVER_MAP_CLIENT_KEY=${{ secrets.REACT_APP_NAVER_MAP_CLIENT_KEY }} \
            --build-arg REACT_APP_NAVER_MAP_SECRET_KEY=${{ secrets.REACT_APP_NAVER_MAP_SECRET_KEY }} \
            --build-arg REACT_APP_VWORLD_MAP_CLIENT_KEY=${{ secrets.REACT_APP_VWORLD_MAP_CLIENT_KEY }} \
            --build-arg REACT_APP_KAKAO_MAP_CLIENT_KEY=${{ secrets.REACT_APP_KAKAO_MAP_CLIENT_KEY }} \
                      --build-arg REACT_APP_FIREBASE_API_KEY=${{ secrets.REACT_APP_FIREBASE_API_KEY }} \
            --build-arg REACT_APP_FIREBASE_AUTH_DOMAIN=${{ secrets.REACT_APP_FIREBASE_AUTH_DOMAIN }} \
            --build-arg REACT_APP_FIREBASE_PROJECT_ID=${{ secrets.REACT_APP_FIREBASE_PROJECT_ID }} \
            --build-arg REACT_APP_FIREBASE_STORAGE_BUCKET=${{ secrets.REACT_APP_FIREBASE_STORAGE_BUCKET }} \
            --build-arg REACT_APP_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }} \
            --build-arg REACT_APP_FIREBASE_APP_ID=${{ secrets.REACT_APP_FIREBASE_APP_ID }} \
            --build-arg REACT_APP_FIREBASE_MEASUREMENT_ID=${{ secrets.REACT_APP_FIREBASE_MEASUREMENT_ID }} \
                      -t ghcr.io/${{ github.repository_owner }}/prime-fe:latest .

      - name: Push Docker image
        run: docker push ghcr.io/${{ github.repository_owner }}/prime-fe:latest

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ github.ref == 'refs/heads/master' && secrets.PROD_SERVER_HOST || secrets.DEV_SERVER_HOST }}
          username: ${{ github.ref == 'refs/heads/master' && secrets.PROD_SERVER_USER || secrets.DEV_SERVER_USER }}
          key: ${{ github.ref == 'refs/heads/master' && secrets.PROD_SERVER_SSH_KEY || secrets.DEV_SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            GHCR_TOKEN=${{ secrets.GHCR_TOKEN }}
            GHCR_USERNAME=${{ secrets.GHCR_USERNAME }}
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            cd /var/www/html/prime
            docker compose -f docker-compose.fe.yaml pull
            docker system prune -a --volumes -f
            docker compose -f docker-compose.fe.yaml down
            docker compose -f docker-compose.fe.yaml up -d 
            docker logout ghcr.io 