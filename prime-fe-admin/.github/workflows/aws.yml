name: FE Build & Push

on:
  push:
    branches:
      - main
      - dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            --build-arg REACT_APP_API_BASE_URL=${{ secrets.REACT_APP_API_BASE_URL }} \
            --build-arg REACT_APP_NAVER_MAP_CLIENT_KEY=${{ secrets.REACT_APP_NAVER_MAP_CLIENT_KEY }} \
            -t ghcr.io/${{ github.repository_owner }}/prime-fe-admin:latest .

      - name: Push Docker image
        run: docker push ghcr.io/${{ github.repository_owner }}/prime-fe-admin:latest

      - name: Deploy to Server via SSH 
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ github.ref == 'refs/heads/main' && secrets.PROD_SERVER_HOST || secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ github.ref == 'refs/heads/main' && secrets.PROD_SERVER_SSH_KEY || secrets.DEV_SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            GHCR_TOKEN=${{ secrets.GHCR_TOKEN }}
            GHCR_USERNAME=${{ secrets.GHCR_USERNAME }}
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            cd /var/www/html/prime_admin
            docker compose -f docker-compose.fe.yaml pull
            docker system prune -a --volumes -f
            docker compose -f docker-compose.fe.yaml down
            docker compose -f docker-compose.fe.yaml up -d 
            docker logout ghcr.io 
